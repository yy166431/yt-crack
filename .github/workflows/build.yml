name: Build YTUnlock dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ldid xz make

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Setup iOS SDK
        run: |
          export THEOS=$HOME/theos
          cd "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          cp -R sdks-master/*.sdk . 2>/dev/null || true
          rm -rf sdks.zip sdks-master
          echo "=== available SDKs ==="
          ls -d *.sdk
          # 必须有 iPhoneOS SDK，否则 theos 会退回 macOS SDK 编出错误平台的 dylib
          if ! ls -d iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "::error::No iPhoneOS SDK found in theos/sdks"; exit 1
          fi

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1
          echo "=== build tree ==="
          find .theos -name '*.dylib' -print

      - name: Collect dylib
        run: |
          mkdir -p out
          find .theos -name 'YTUnlock.dylib' -exec cp {} out/ \; 2>/dev/null || true
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            find .theos -name '*.dylib' -exec cp {} out/ \; 2>/dev/null || true
          fi
          echo "=== final dylib(s) ==="
          ls -la out/
          echo "=== Mach-O 类型确认（必须是 arm64 iOS dylib，不能是 x86_64/macOS）==="
          for f in out/*.dylib; do
            echo ">>> $f"; file "$f"; lipo -info "$f" || true
            echo "--- platform load command ---"
            otool -l "$f" | grep -A4 -iE "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS|platform" | head -20 || true
            otool -L "$f" || true
          done
          echo "=== ldid -S 复验（复现注入器的签名步骤）==="
          for f in out/*.dylib; do
            ldid -S "$f" && echo "ldid OK: $f" || echo "ldid FAILED: $f"
          done

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: YTUnlock-dylib
          path: out/*.dylib
          if-no-files-found: error
