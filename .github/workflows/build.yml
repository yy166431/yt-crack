name: Build YTUnlock dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: brew install ldid xz make

      - name: Setup Theos
        run: |
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"

      - name: Setup iOS SDK
        run: |
          export THEOS=$HOME/theos
          cd "$THEOS/sdks"
          curl -L https://github.com/theos/sdks/archive/refs/heads/master.zip -o sdks.zip
          unzip -q sdks.zip
          cp -R sdks-master/*.sdk . 2>/dev/null || true
          rm -rf sdks.zip sdks-master
          echo "=== available SDKs ==="
          ls -d *.sdk
          # 必须有 iPhoneOS SDK，否则 theos 会退回 macOS SDK 编出错误平台的 dylib
          if ! ls -d iPhoneOS*.sdk >/dev/null 2>&1; then
            echo "::error::No iPhoneOS SDK found in theos/sdks"; exit 1
          fi

      - name: Build dylib
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1
          echo "=== build tree (所有 dylib 候选 + 类型) ==="
          find .theos -name '*.dylib' -not -path '*.dSYM*' | while read f; do echo "$f -> $(file -b "$f")"; done

      - name: Collect dylib
        run: |
          mkdir -p out
          echo "=== 所有 YTUnlock.dylib 候选及其 filetype ==="
          # 排除 .dSYM 目录（里面有个同名文件但 filetype=MH_DSYM，ldid 会报 Unsupported Mach-O type）
          # 只收 Mach-O filetype == MH_DYLIB (0x6) 的真正产物
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # 用 file 判定；真正 dylib 显示 "dynamically linked shared library"，
            # dSYM 显示 "dSYM companion file"
            desc=$(file -b "$f")
            echo "  candidate: $f -> $desc"
            case "$desc" in
              *"shared library"*|*"dynamically linked"*)
                cp "$f" out/YTUnlock.dylib
                echo "  ^ picked (real dylib)"
                ;;
            esac
          done < <(find .theos -name 'YTUnlock.dylib' -not -path '*.dSYM*')

          if [ ! -f out/YTUnlock.dylib ]; then
            echo "::error::未找到 filetype=MH_DYLIB 的 YTUnlock.dylib"
            echo "全部候选（含 dSYM）:"; find .theos -name '*.dylib*' -print
            exit 1
          fi
          echo "=== final dylib ==="
          ls -la out/
          echo "=== Mach-O 类型确认（必须是 arm64 iOS dylib，不能是 x86_64/macOS）==="
          for f in out/*.dylib; do
            echo ">>> $f"; file "$f"; lipo -info "$f" || true
            echo "--- platform load command ---"
            otool -l "$f" | grep -A4 -iE "LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS|platform" | head -20 || true
            otool -L "$f" || true
          done
          echo "=== 检查是否残留 chained fixups（应为空，否则老 ldid 会拒绝）==="
          for f in out/*.dylib; do
            if otool -l "$f" | grep -q "LC_DYLD_CHAINED_FIXUPS"; then
              echo "::warning::$f 仍含 LC_DYLD_CHAINED_FIXUPS"
            else
              echo "OK 无 chained fixups: $f"
            fi
          done
          echo "=== ldid -S 复验（复现注入器的签名步骤）==="
          for f in out/*.dylib; do
            ldid -S "$f" && echo "ldid OK: $f" || echo "ldid FAILED: $f"
          done

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: YTUnlock-dylib
          path: out/*.dylib
          if-no-files-found: error
